<style>
  @media (prefers-color-scheme: dark) {
    .email-bg { background:#0B0F19 !important; }
    .email-card { background:#0B0F19 !important; }
    .email-ink { color:#F3F4F6 !important; }
    .email-muted { color:#9CA3AF !important; }
    .email-hairline { border-color:#232838 !important; }
    .logo-light { display:none !important; }
    .logo-dark { display:block !important; }
  }
</style>
<div class="email-bg" style="background:#FFFFFF;padding:40px 20px;font-family:-apple-system,'Segoe UI',Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;margin:0 auto;">
    <tr>
      <td class="email-card" style="background:#FFFFFF;">
        <table role="presentation" cellpadding="0" cellspacing="0">
          <tr>
            <td style="vertical-align:middle;">
  <span style="display:inline-block;">
    <img src="https://sign.toowix.com/static/js/assets/images/email-logo-light.png" width="87" height="32" alt="SignToowix" class="logo-light" style="display:block;border:0;background:transparent;" />
    <img src="https://sign.toowix.com/static/js/assets/images/email-logo-dark.png" width="87" height="32" alt="SignToowix" class="logo-dark" style="display:none;border:0;background:transparent;" />
  </span></td>
          </tr>
        </table>

        <div class="email-hairline" style="height:1px;background:#E5E7EB;margin:22px 0 26px;"></div>

        <div class="email-ink" style="color:#1A1A1A;font-size:18px;font-weight:700;line-height:1.4;">Reset your password</div>
        <div class="email-muted" style="color:#6B7280;font-size:14px;line-height:1.65;margin-top:10px;">Hi {{username}}, we received a request to reset your password. Click below to choose a new one.</div>
        
        

        <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
    <tr>
      <td style="padding:24px 0 4px;">
        <table role="presentation" cellpadding="0" cellspacing="0">
          <tr>
            <td style="background:#1B4F91;border-radius:8px;">
              <a href="{{link}}" style="display:inline-block;padding:12px 26px;font:600 14px/1 -apple-system,'Segoe UI',Arial,sans-serif;color:#FFFFFF;text-decoration:none;border-radius:8px;">Reset password</a>
            </td>
          </tr>
        </table>
        <div style="margin-top:14px;font:400 12px/1.6 -apple-system,'Segoe UI',Arial,sans-serif;color:#9CA3AF;word-break:break-all;">
          Or copy this link: <span style="color:#1B4F91;">{{link}}</span>
        </div>
      </td>
    </tr></table>

        <div class="email-hairline" style="height:1px;background:#E5E7EB;margin:30px 0 16px;"></div>
        <div class="email-muted" style="color:#9CA3AF;font-size:12px;line-height:1.6;">
          Didn't request this? You can safely ignore this email — your password will stay the same.
        </div>
      </td>
    </tr>
  </table>
</div>
