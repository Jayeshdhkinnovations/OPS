server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 100m;

    # The base image ships with `gzip on` commented out, so the app bundle
    # was going over the wire uncompressed - roughly 3.4MB instead of 960KB,
    # which is what made first load painful on a slow connection.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    # 5 is the knee of the curve: near-max ratio for a fraction of the CPU
    # of 9, and these are static files served many times.
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        image/svg+xml
        font/woff
        font/woff2;

    # Vite fingerprints every asset filename, so a changed file is always a
    # new URL - the old one can be cached permanently and never revalidated.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Every company's API calls (from the browser, same-origin) land under
    # /app/<slug>/... - forwarded to the backend, which handles routing to
    # the right company internally. proxy_pass has no path here on purpose,
    # so the full original URI is passed through unchanged.
    location /app/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Internal-only: SuperAdminServer calls this (from inside the Docker
    # network, using this container's name) to hot-mount a new company.
    # The path itself is reachable through this same public Nginx too, so
    # the real protection is the secret header the backend checks - not
    # network isolation. See index.js's /admin/mount-company handler.
    location /admin/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static SignToowix-branded docs page (apps/OpenSign/public/docs/index.html
    # at build time). Explicit block so /docs (no trailing slash) resolves to
    # docs/index.html instead of falling into the SPA catch-all below.
    location /docs {
        try_files $uri $uri/ /docs/index.html;
    }

    # SPA routing - any other path serves index.html so client-side routing
    # (react-router) handles it, instead of Nginx 404ing on a page refresh.
    # index.html itself must never be cached: it is the only file naming the
    # current asset hashes, so a stale copy would keep pointing browsers at
    # the previous deploy's bundles.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
