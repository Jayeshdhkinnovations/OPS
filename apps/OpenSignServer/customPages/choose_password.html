<!DOCTYPE html>
<!--
  Restyled version of parse-server's stock views/choose_password template.
  Every form field id/name, and the entire <script> block below, is
  byte-for-byte unchanged from the original - that JS is what builds the
  POST target from the URL's `id` param and wires up the token/username
  hidden fields, so touching it would break the reset flow itself. Only the
  markup and CSS around it were replaced, to match the Login/Register/
  Forgot-Password split-panel design.

  Deployed by copying over node_modules/parse-server/views/choose_password
  during the Docker build (see Dockerfile) - parse-server has no supported
  hook to point at a project file directly for this legacy page.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset Password - SignToowix</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        /* 100vh on mobile Safari includes the space behind the collapsible
           address bar, so the card centered with true vertical space to
           spare looked pinned near the top with dead space below. 100dvh
           excludes that - same fix already used on the React auth pages. */
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #F7F8FC;
        font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        padding: 16px;
        overflow-y: auto;
      }
      .mobile-brand {
        display: none;
        align-items: center;
        gap: 10px;
        margin-bottom: 24px;
      }
      .mobile-brand .mark {
        width: 36px; height: 36px; border-radius: 12px;
        background: #0B3D73; display: flex; align-items: center; justify-content: center;
        flex-shrink: 0;
      }
      .mobile-brand .mark span {
        color: #fff; font-weight: 700; font-size: 16px;
      }
      .mobile-brand .name {
        font-size: 18px; font-weight: 700; color: #1f2937; letter-spacing: -.2px;
      }
      .card {
        margin: auto;
        display: flex;
        width: 100%;
        max-width: 900px;
        background: #FFFFFF;
        border-radius: 26px;
        overflow: hidden;
        box-shadow: 0 40px 80px -30px rgba(70,60,160,0.28);
      }
      .hero {
        width: 44%;
        flex-shrink: 0;
        background: linear-gradient(135deg, #0B3D73, #002864);
        padding: 34px 32px;
        color: #fff;
        display: flex;
        flex-direction: column;
      }
      .brand { display: flex; align-items: center; gap: 12px; }
      .brand .mark {
        width: 40px; height: 40px; border-radius: 12px;
        background: #fff; display: flex; align-items: center; justify-content: center;
        box-shadow: 0 2px 6px rgba(0,0,0,.15);
        font-weight: 700; color: #0B3D73; font-size: 18px;
      }
      .brand .name { font-size: 18px; font-weight: 700; letter-spacing: .3px; }
      .brand .tag { font-size: 10px; color: rgba(255,255,255,.8); margin-top: 2px; }
      .hero h2 { font-size: 22px; line-height: 1.35; margin: 40px 0 12px; font-weight: 700; }
      .hero p { font-size: 14px; color: rgba(255,255,255,.9); line-height: 1.5; margin: 0; }
      .shield { margin-top: auto; opacity: .9; }
      .form-side {
        flex: 1;
        padding: 46px 46px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      h1 {
        font-size: 24px; font-weight: 700; color: #1f2937; margin: 0 0 4px; letter-spacing: -.2px;
      }
      .sub { font-size: 13px; color: #9ca3af; margin: 0 0 28px; font-weight: 500; }
      .sub b { color: #4b5563; }
      label { display: block; font-size: 12px; font-weight: 600; color: #4b5563; margin: 18px 0 6px; }
      label:first-of-type { margin-top: 0; }
      input[type="password"] {
        width: 100%;
        border: 1px solid #d1d5db;
        border-radius: 999px;
        padding: 13px 20px;
        font-size: 15px;
        color: #1f2937;
        background: #fff;
        outline: none;
        transition: border-color .15s, box-shadow .15s;
        font-family: inherit;
      }
      input[type="password"]:focus {
        border-color: #0B3D73;
        box-shadow: 0 0 0 3px rgba(11,61,115,.12);
      }
      #password_match_info { display: block; min-height: 16px; margin-top: 6px; font-size: 12px; color: #ef4444; font-weight: 600; }
      .error { color: #ef4444; font-size: 13px; font-weight: 600; margin: 0 0 12px; min-height: 0; }
      button {
        width: 100%;
        margin-top: 26px;
        padding: 15px 24px;
        border: none;
        border-radius: 999px;
        font-size: 15px;
        font-weight: 700;
        color: #fff;
        background: linear-gradient(90deg, #1B4F91, #0B3D73);
        cursor: pointer;
        font-family: inherit;
        transition: opacity .15s;
      }
      button:hover:not(:disabled) { opacity: .9; }
      button:disabled { opacity: .5; cursor: not-allowed; }
      @media (max-width: 760px) {
        .hero { display: none; }
        .form-side { padding: 40px 26px; }
        .mobile-brand { display: flex; }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="hero">
        <div class="brand">
          <div class="mark">S</div>
          <div>
            <div class="name">SignToowix</div>
            <div class="tag">Secure Digital Document Platform</div>
          </div>
        </div>
        <h2>Choose a strong new password to keep your account secure.</h2>
        <p>Use at least 8 characters, mixing letters, numbers and symbols for the best protection.</p>
        <div class="shield">
          <svg width="120" height="120" viewBox="0 0 24 24" fill="none">
            <path d="M12 2 L20 5.5 V11 C20 16 16.5 19.7 12 21 C7.5 19.7 4 16 4 11 V5.5 Z" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
            <path d="M8.5 12 L11 14.5 L16 9" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>
      <div class="form-side">
        <div class="mobile-brand">
          <div class="mark"><span>S</span></div>
          <div class="name">SignToowix</div>
        </div>
        <h1>Reset Password<span id="app"></span></h1>
        <p class="sub">Setting a new password for <b id="username_label"></b></p>
        <noscript>Resetting your password requires JavaScript to be enabled.</noscript>
        <div class="error" id="error"></div>
        <form id="form" action="#" method="POST">
          <label for="password">New password</label>
          <input name="new_password" type="password" id="password" placeholder="Enter new password" />

          <label for="password_confirm">Confirm new password</label>
          <input name="confirm_new_password" type="password" id="password_confirm" placeholder="Re-enter new password" />
          <span id="password_match_info"></span>

          <input name="utf-8" type="hidden" value="&#10003;" />
          <input name="username" id="username" type="hidden" />
          <input name="token" id="token" type="hidden" />

          <button id="change_password">Reset Password</button>
        </form>
      </div>
    </div>

    <script language="javascript" type="text/javascript">
      <!--

    </script>
  </body>
</html>
