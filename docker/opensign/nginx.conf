server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 100m;

    # Every company's API calls (from the browser, same-origin) land under
    # /app/<slug>/... - forwarded to the backend, which handles routing to
    # the right company internally. proxy_pass has no path here on purpose,
    # so the full original URI is passed through unchanged.
    location /app/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Internal-only: SuperAdminServer calls this (from inside the Docker
    # network, using this container's name) to hot-mount a new company.
    # The path itself is reachable through this same public Nginx too, so
    # the real protection is the secret header the backend checks - not
    # network isolation. See index.js's /admin/mount-company handler.
    location /admin/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA routing - any other path serves index.html so client-side routing
    # (react-router) handles it, instead of Nginx 404ing on a page refresh.
    location / {
        try_files $uri /index.html;
    }
}
