server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API calls (from the browser, same-origin) get forwarded internally to
    # the backend process running in this same container. proxy_pass has no
    # path here on purpose, so the full original /app/... URI is passed
    # through unchanged - the backend already expects that exact prefix.
    location /app {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA routing - any other path serves index.html so client-side routing
    # (react-router) handles it, instead of Nginx 404ing on a page refresh.
    location / {
        try_files $uri /index.html;
    }
}
